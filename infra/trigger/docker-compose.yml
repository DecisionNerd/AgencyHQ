name: trigger

x-logging: &logging-config
  driver: ${LOGGING_DRIVER:-local}
  options:
    max-size: ${LOGGING_MAX_SIZE:-20m}
    max-file: ${LOGGING_MAX_FILES:-5}
    compress: ${LOGGING_COMPRESS:-true}

services:
  webapp:
    # agencyhq: pin the default tag to the vendored release instead of
    # upstream's floating `latest`; .env.example sets TRIGGER_IMAGE_TAG=v4.5.16
    image: ghcr.io/triggerdotdev/trigger.dev:${TRIGGER_IMAGE_TAG:-v4.5.16}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    ports:
      # agencyhq: default changed to 127.0.0.1 (loopback only); upstream default
      # was 0.0.0.0. The .env.example already sets WEBAPP_PUBLISH_IP=127.0.0.1.
      # See UPSTREAM.md § edit 7.
      - ${WEBAPP_PUBLISH_IP:-127.0.0.1}:${WEBAPP_PORT:-8030}:3000
    depends_on:
      - postgres
      - redis
      - clickhouse
      - s2
    networks:
      - webapp
      - supervisor
      # agencyhq: attach webapp to the agencyhq network so runner task
      # containers (joined via DOCKER_RUNNER_NETWORKS) can reach it.
      - agencyhq
    volumes:
      - shared:/home/node/shared
      - secrets:/run/agencyhq/secrets:ro
    # Only needed for bootstrap
    user: root
    # Only needed for bootstrap
    # agencyhq: tolerant secrets wrapper — sources webapp.env from the secrets
    # volume if present (container profile), no-ops if absent (host profile).
    # env.server.ts var names confirmed at v4.5.16, 2026-09-09 (see UPSTREAM.md).
    command: >
      sh -c "
        if [ -f /run/agencyhq/secrets/webapp.env ]; then
          set -a && . /run/agencyhq/secrets/webapp.env && set +a
        fi &&
        chown -R node:node /home/node/shared &&
        exec ./scripts/entrypoint.sh
      "
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "http.get('http://localhost:3000/healthcheck', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8030}
      LOGIN_ORIGIN: ${LOGIN_ORIGIN:-http://localhost:8030}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8030}
      ELECTRIC_ORIGIN: http://electric:3000
      # Realtime streams v2, backed by the bundled s2-lite service. This powers
      # AI-agent token streaming and run streams. Point the endpoint at a hosted
      # S2 (https://s2.dev) instead by overriding these and setting an access token.
      # To fall back to the Redis-backed v1 streams, set the version to `v1`.
      REALTIME_STREAMS_DEFAULT_VERSION: ${REALTIME_STREAMS_DEFAULT_VERSION:-v2}
      REALTIME_STREAMS_S2_BASIN: ${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}
      REALTIME_STREAMS_S2_ENDPOINT: ${REALTIME_STREAMS_S2_ENDPOINT:-http://s2/v1}
      REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS: ${REALTIME_STREAMS_S2_SKIP_ACCESS_TOKENS:-true}
      REALTIME_STREAMS_S2_ACCESS_TOKEN: ${REALTIME_STREAMS_S2_ACCESS_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/main?schema=public&sslmode=disable}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/main?schema=public&sslmode=disable}
      # agencyhq: empty placeholders — container-profile webapp wrapper sources the
      # real values from /run/agencyhq/secrets/webapp.env before exec-ing entrypoint.
      SESSION_SECRET: ${SESSION_SECRET:-}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PROVIDER_SECRET: ${PROVIDER_SECRET:-}
      COORDINATOR_SECRET: ${COORDINATOR_SECRET:-}
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS_DISABLED: true
      APP_LOG_LEVEL: info
      DEV_OTEL_EXPORTER_OTLP_ENDPOINT: ${DEV_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:8030/otel}
      # agencyhq: default follows the registry's publish port change below
      # (host port 5000 is held by macOS AirPlay Receiver on this host)
      DEPLOY_REGISTRY_HOST: ${DOCKER_REGISTRY_URL:-localhost:5001}
      DEPLOY_REGISTRY_NAMESPACE: ${DOCKER_REGISTRY_NAMESPACE:-trigger}
      OBJECT_STORE_BASE_URL: ${OBJECT_STORE_BASE_URL:-http://minio:9000}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:-}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:-}
      GRACEFUL_SHUTDOWN_TIMEOUT: 1000
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE}
      # Bootstrap - this will automatically set up a worker group for you
      # This will NOT work for split deployments
      TRIGGER_BOOTSTRAP_ENABLED: 1
      TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME: bootstrap
      TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH: /home/node/shared/worker_token
      # ClickHouse configuration
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD}@clickhouse:8123?secure=false}
      CLICKHOUSE_LOG_LEVEL: ${CLICKHOUSE_LOG_LEVEL:-info}
      # Run replication
      RUN_REPLICATION_ENABLED: ${RUN_REPLICATION_ENABLED:-1}
      RUN_REPLICATION_CLICKHOUSE_URL: ${RUN_REPLICATION_CLICKHOUSE_URL:-http://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD}@clickhouse:8123}
      RUN_REPLICATION_LOG_LEVEL: ${RUN_REPLICATION_LOG_LEVEL:-info}
      # Limits
      # TASK_PAYLOAD_OFFLOAD_THRESHOLD: 524288 # 512KB
      # TASK_PAYLOAD_MAXIMUM_SIZE: 3145728 # 3MB
      # BATCH_TASK_PAYLOAD_MAXIMUM_SIZE: 1000000 # 1MB
      # TASK_RUN_METADATA_MAXIMUM_SIZE: 262144 # 256KB
      # DEFAULT_ENV_EXECUTION_CONCURRENCY_LIMIT: 100
      # DEFAULT_ORG_EXECUTION_CONCURRENCY_LIMIT: 100
      # Internal OTEL configuration
      INTERNAL_OTEL_TRACE_LOGGING_ENABLED: ${INTERNAL_OTEL_TRACE_LOGGING_ENABLED:-0}
      # ── agencyhq container-profile settings ─────────────────────────────────
      # Tolerant: sourced from secrets volume on container profile; overridable
      # via host .env for the host profile. See UPSTREAM.md § edit 8.
      # env.server.ts line 379: EMAIL_TRANSPORT z.enum(["resend","smtp","aws-ses"])
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      # env.server.ts line 383: SMTP_HOST z.string().optional()
      SMTP_HOST: ${SMTP_HOST:-bootstrap}
      # env.server.ts line 384: SMTP_PORT z.coerce.number().optional()
      SMTP_PORT: ${SMTP_PORT:-2525}
      # env.server.ts line 385: SMTP_SECURE BoolEnv.optional()
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # env.server.ts line 380: FROM_EMAIL z.string().optional()
      FROM_EMAIL: ${FROM_EMAIL:-bootstrap@agencyhq.local}
      # env.server.ts line 333: WHITELISTED_EMAILS optional regex.
      # Container profile: set via webapp.env (secrets-init reads AGENCYHQ_BOOTSTRAP_EMAIL).
      # Host profile: empty = no restriction.
      WHITELISTED_EMAILS: ${WHITELISTED_EMAILS:-}
      # env.server.ts line 337: ADMIN_EMAILS optional regex.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # env.server.ts line 152: NODE_ENV. Do not use development: weakens auth.
      NODE_ENV: ${NODE_ENV:-production}
      # env.server.ts line 815: DEPLOY_IMAGE_PLATFORM z.string().default("linux/amd64")
      DEPLOY_IMAGE_PLATFORM: ${AGENCYHQ_PLATFORM:-linux/arm64}
      # env.server.ts line 374: TRIGGER_TELEMETRY_DISABLED
      TRIGGER_TELEMETRY_DISABLED: ${TRIGGER_TELEMETRY_DISABLED:-1}

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-14}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    ports:
      - ${POSTGRES_PUBLISH_IP:-127.0.0.1}:5433:5432
    volumes:
      - postgres:/var/lib/postgresql/data/
      # agencyhq: secrets volume for tolerant password wrapper (see UPSTREAM.md § edit 8).
      # For the host profile this volume is declared but empty; the wrapper is a no-op.
      - secrets:/run/agencyhq/secrets:ro
    networks:
      - webapp
    # agencyhq: tolerant wrapper — reads password from secrets volume on
    # container profile; falls back to POSTGRES_PASSWORD on host profile.
    entrypoint:
      - sh
      - -c
    command:
      - >
        if [ -f /run/agencyhq/secrets/trigger-db-password ]; then
          export POSTGRES_PASSWORD=$(cat /run/agencyhq/secrets/trigger-db-password);
        fi &&
        exec docker-entrypoint.sh -c wal_level=logical
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # agencyhq: upstream's `:?` guard fails `docker compose config` itself
      # (not just `up`) whenever .env.example's shipped blank is still in
      # place, which blocks validating this file before secrets exist.
      # Container profile: the entrypoint wrapper above reads the real password
      # from the secrets volume (overrides this empty placeholder).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-main}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    ports:
      - ${REDIS_PUBLISH_IP:-127.0.0.1}:6389:6379
    volumes:
      - redis:/data
    networks:
      - webapp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  electric:
    image: electricsql/electric:${ELECTRIC_IMAGE_TAG:-1.2.4}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    depends_on:
      - postgres
    networks:
      - webapp
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/main?schema=public&sslmode=disable}
      ELECTRIC_INSECURE: true
      ELECTRIC_USAGE_REPORTING: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_IMAGE_TAG:-26.2}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    ports:
      - ${CLICKHOUSE_PUBLISH_IP:-127.0.0.1}:9123:8123
      - ${CLICKHOUSE_PUBLISH_IP:-127.0.0.1}:9090:9000
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      # agencyhq: see the POSTGRES_PASSWORD comment above - same reasoning.
      # Container profile: the entrypoint wrapper sources clickhouse.env from
      # the secrets volume, which exports the real CLICKHOUSE_PASSWORD.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      # The same volume works across upgrades from the previous Bitnami-based
      # setup: data-paths.xml keeps the on-disk layout compatible.
      - clickhouse:/var/lib/clickhouse
      - ../clickhouse/data-paths.xml:/etc/clickhouse-server/config.d/data-paths.xml:ro
      - ../clickhouse/override.xml:/etc/clickhouse-server/config.d/override.xml:ro
      - ../clickhouse/users-override.xml:/etc/clickhouse-server/users.d/override.xml:ro
      # agencyhq: secrets volume for tolerant password wrapper (see UPSTREAM.md § edit 8).
      - secrets:/run/agencyhq/secrets:ro
    networks:
      - webapp
    # agencyhq: tolerant entrypoint wrapper — sources clickhouse.env (which
    # exports CLICKHOUSE_PASSWORD) from the secrets volume on the container
    # profile; no-ops on the host profile when the file is absent.
    entrypoint:
      - /bin/bash
      - -c
    command:
      - >
        if [ -f /run/agencyhq/secrets/clickhouse.env ]; then
          set -a && . /run/agencyhq/secrets/clickhouse.env && set +a
        fi &&
        exec /entrypoint.sh
    healthcheck:
      # agencyhq: use the unauthenticated HTTP /ping endpoint instead of
      # clickhouse-client with --password (not available at healthcheck time).
      # See UPSTREAM.md § edit 8.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  registry:
    image: registry:${REGISTRY_IMAGE_TAG:-2}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    # agencyhq: host port 5000 is held by macOS AirPlay Receiver on this
    # host; publish on 5001 instead. Container port is unchanged.
    ports:
      - ${REGISTRY_PUBLISH_IP:-127.0.0.1}:5001:5000
    networks:
      - webapp
    # agencyhq: no htpasswd authentication — the registry is published only on
    # 127.0.0.1 (loopback), so network isolation is the access control.
    # See UPSTREAM.md § edit 6 for the rationale.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    # agencyhq: the bitnamilegacy/minio repo is frozen and only republishes
    # `latest`; pin the default to the exact tag `latest` resolved to when
    # read on 2026-09-07 (same image digest) instead of a bare `latest`
    image: bitnamilegacy/minio:${MINIO_IMAGE_TAG:-2025.5.24-debian-12-r5}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    ports:
      - ${MINIO_PUBLISH_IP:-127.0.0.1}:9000:9000
      - ${MINIO_PUBLISH_IP:-127.0.0.1}:9001:9001
    networks:
      - webapp
    volumes:
      - minio:/bitnami/minio/data
      # agencyhq: secrets volume for tolerant password wrapper (see UPSTREAM.md § edit 8).
      - secrets:/run/agencyhq/secrets:ro
    # agencyhq: tolerant entrypoint wrapper — sources minio.env (which exports
    # MINIO_ROOT_USER/PASSWORD) from the secrets volume on the container profile;
    # no-ops on the host profile when the file is absent.
    entrypoint:
      - /bin/bash
      - -c
    command:
      - >
        if [ -f /run/agencyhq/secrets/minio.env ]; then
          set -a && . /run/agencyhq/secrets/minio.env && set +a
        fi &&
        exec /opt/bitnami/scripts/minio/entrypoint.sh /opt/bitnami/scripts/minio/run.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${OBJECT_STORE_ACCESS_KEY_ID:-admin}}
      # agencyhq: see the POSTGRES_PASSWORD comment above - same reasoning.
      # Container profile: the entrypoint wrapper sources minio.env from the
      # secrets volume, which exports the real MINIO_ROOT_PASSWORD.
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${OBJECT_STORE_SECRET_ACCESS_KEY:-}}
      MINIO_DEFAULT_BUCKETS: packets
      MINIO_BROWSER: "on"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Generates the s2-lite basin spec from REALTIME_STREAMS_S2_BASIN so the bundled
  # basin always matches the basin the webapp targets. s2-lite is distroless (no
  # shell), so a tiny init container writes the spec into a shared volume first.
  s2-init:
    image: busybox:${BUSYBOX_IMAGE_TAG:-1.37}
    restart: "no"
    logging: *logging-config
    environment:
      REALTIME_STREAMS_S2_BASIN: ${REALTIME_STREAMS_S2_BASIN:-trigger-realtime}
    command:
      - sh
      - -c
      - |
        cat > /config/s2-spec.json <<JSON
        {
          "basins": [
            {
              "name": "$$REALTIME_STREAMS_S2_BASIN",
              "config": { "create_stream_on_append": true, "create_stream_on_read": true }
            }
          ]
        }
        JSON
    volumes:
      - s2-config:/config
    networks:
      - webapp

  # s2-lite: the open-source, self-hostable S2 (https://s2.dev) server that backs
  # realtime streams v2. It's distroless (no shell), so a wget/curl healthcheck
  # always reports unhealthy even when the API is up — hence no healthcheck.
  # Runs as root so it can write to the named volume; storage lives in SlateDB
  # under /data, and the basin is created on startup from the generated spec.
  s2:
    # agencyhq: drop the redundant `:latest` tag qualifier from upstream's
    # digest-pinned default; the digest alone is upstream's own recommended
    # pin (see .env.example) and this avoids a floating-`latest` substring
    image: ${S2_IMAGE:-ghcr.io/s2-streamstore/s2@sha256:d6ded5ca7dd619fa7c946f06e39a98f9c95c6883c8bb884e5eaa129f232c920c}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    depends_on:
      s2-init:
        condition: service_completed_successfully
    command: ["lite", "--init-file", "/config/s2-spec.json", "--local-root", "/data"]
    user: "0:0"
    volumes:
      - s2-config:/config
      - s2:/data
    networks:
      - webapp

volumes:
  clickhouse:
  postgres:
  redis:
  shared:
  minio:
  s2:
  s2-config:
  # agencyhq: secrets volume shared with infra/agencyhq/compose.yaml.
  # On the host profile this is declared but empty (wrapper is a no-op).
  # On the container profile secrets-init populates it before any service starts.
  secrets:

networks:
  docker-proxy:
    name: docker-proxy
  supervisor:
    name: supervisor
  webapp:
    name: webapp
  # agencyhq: shared with infra/agencyhq/compose.yaml (same Docker network name).
  # webapp joins this network so runner task containers (joined via
  # DOCKER_RUNNER_NETWORKS) can reach http://webapp:3000 and http://app:8787.
  agencyhq:
    name: agencyhq
