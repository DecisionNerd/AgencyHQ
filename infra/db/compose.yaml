services:
  postgres:
    image: postgres:17.6
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: agencyhq
      POSTGRES_PASSWORD: agencyhq
      POSTGRES_DB: agencyhq_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencyhq"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - agencyhq_test_data:/var/lib/postgresql/data

volumes:
  agencyhq_test_data:
