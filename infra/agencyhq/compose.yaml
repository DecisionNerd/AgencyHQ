# infra/agencyhq/compose.yaml — AgencyHQ application services for the container profile.
#
# Included by the root compose.yaml as part of the agencyhq project.
# Do not start this file directly; use root `docker compose up -d`.
#
# Services:
#   secrets-init    — one-shot: generates all internal secrets into the secrets volume
#   app             — coordinator + web dist (uid 1000)
#   agencyhq-postgres — AgencyHQ domain ledger (postgres:17.6; separate from Trigger's postgres:14)
#   opencode        — OpenCode AI provider login service (sleep infinity)
#   bootstrap       — one-shot: bootstraps Trigger project, deploys task image (restart on-failure)
#   docker-proxy-build — tecnativa/docker-socket-proxy limited to build operations only;
#                        reachable only by the bootstrap container
#
# Networks (defined here; referenced by Trigger files via `external: true` naming):
#   agencyhq          — connects app, opencode, bootstrap, and runner task containers
#   agencyhq-internal — connects app and agencyhq-postgres only; runners cannot reach the ledger
#   docker-proxy-build — connects bootstrap to its dedicated Docker socket proxy
#
# Volumes (all named, no host-path binds except the docker socket in docker-proxy-build):
#   secrets            — internal secrets generated by secrets-init; 0600 files
#   agencyhq-state     — bootstrap state: phase file, trigger-secret-key, deployment.json
#   agencyhq-git       — coordinator-managed git mirrors and bundles
#   agencyhq-postgres  — AgencyHQ domain database data
#   opencode-data      — OpenCode provider credentials ($HOME/.local/share/opencode)
#   opencode-config    — OpenCode additional configuration

x-logging: &logging-config
  driver: ${LOGGING_DRIVER:-local}
  options:
    max-size: ${LOGGING_MAX_SIZE:-20m}
    max-file: ${LOGGING_MAX_FILES:-5}
    compress: ${LOGGING_COMPRESS:-true}

# Image reference for AgencyHQ application containers.
# The Dockerfile has multiple targets; each service specifies its target below.
x-app-image: &app-image
  build:
    context: ../..
    dockerfile: infra/app/Dockerfile
    # Platform is declared at build time; AGENCYHQ_PLATFORM propagates from the
    # root .env (default: linux/arm64). Override in compose.override.yaml.
    platforms:
      - ${AGENCYHQ_PLATFORM:-linux/arm64}

services:
  # ── secrets-init ────────────────────────────────────────────────────────────
  # One-shot service that generates all internal secrets on first boot and on
  # every subsequent `docker compose up`. Idempotent: never rotates a non-empty
  # value. Must complete before any service that needs secrets starts.
  secrets-init:
    <<: *app-image
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile
      target: tools
      platforms:
        - ${AGENCYHQ_PLATFORM:-linux/arm64}
    image: agencyhq/app:tools
    restart: "no"
    logging: *logging-config
    environment:
      SECRETS_DIR: /run/agencyhq/secrets
      # Pass bootstrap email so secrets-init can write WHITELISTED_EMAILS/ADMIN_EMAILS
      # to webapp.env (sourced by the webapp tolerant wrapper on startup).
      AGENCYHQ_BOOTSTRAP_EMAIL: ${AGENCYHQ_BOOTSTRAP_EMAIL:-bootstrap@agencyhq.local}
    volumes:
      - secrets:/run/agencyhq/secrets
    networks: []
    # Bypass the app entrypoint wrapper: it requires the secrets this job creates.
    entrypoint: ["node", "/usr/local/bin/secrets-init.mjs"]
    command: []

  # ── app ─────────────────────────────────────────────────────────────────────
  # AgencyHQ coordinator + web dist. Runs migrations on start; serves the
  # React web app from WEB_DIST. Reaches Trigger webapp on the `webapp` network
  # and agencyhq-postgres on `agencyhq-internal`. Runner task containers reach
  # the coordinator on the `agencyhq` network at http://app:8787/internal/*.
  app:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile
      target: app
      platforms:
        - ${AGENCYHQ_PLATFORM:-linux/arm64}
    image: agencyhq/app:app
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      agencyhq-postgres:
        condition: service_healthy
    networks:
      - agencyhq-internal  # app ↔ agencyhq-postgres (ledger; runners cannot reach this)
      - agencyhq           # app ↔ opencode, bootstrap, runner task containers
      - webapp             # app ↔ Trigger webapp (for RealExecutionRuntime calls)
    volumes:
      - secrets:/run/agencyhq/secrets:ro
      - agencyhq-state:/var/agencyhq/state
      - agencyhq-git:/var/agencyhq/git
      - opencode-data:/var/agencyhq/opencode:ro
    ports:
      - ${AGENCYHQ_APP_PUBLISH_IP:-127.0.0.1}:${AGENCYHQ_APP_PORT:-8787}:8787
    environment:
      RUNTIME: ${AGENCYHQ_RUNTIME:-real}
      TRIGGER_API_URL: ${TRIGGER_API_URL:-http://webapp:3000}
      AGENCYHQ_WORKTREE_BASE: /var/agencyhq/git
      AGENCYHQ_WORKER_MODEL: ${AGENCYHQ_WORKER_MODEL:-opencode/big-pickle}
      AGENCYHQ_LEAD_MODEL: ${AGENCYHQ_LEAD_MODEL:-opencode/big-pickle}
      AGENCYHQ_REVIEWER_MODEL: ${AGENCYHQ_REVIEWER_MODEL:-opencode/big-pickle}
      AGENCYHQ_LEAD_VARIANT: ${AGENCYHQ_LEAD_VARIANT:-}
      AGENCYHQ_WORKER_SLOTS: ${AGENCYHQ_WORKER_SLOTS:-1}
      AGENCYHQ_STATE_DIR: /var/agencyhq/state
      AGENCYHQ_GIT_DIR: /var/agencyhq/git
      WEB_DIST: /app/apps/web/dist
      PORT: "8787"
      AGENCYHQ_BIND_HOST: "0.0.0.0"
      RECONCILE_INTERVAL_MS: "5000"
      AGENCYHQ_UNCERTAIN_AFTER_MS: "120000"
      # DATABASE_URL and AGENCYHQ_API_TOKEN are injected by entrypoint-app.sh
      # from /run/agencyhq/secrets/agencyhq.env (set by secrets-init).
      # TRIGGER_SECRET_KEY is read lazily by the coordinator from
      # /var/agencyhq/state/trigger-prod.key (written by bootstrap); no
      # entrypoint injection needed — the app starts before bootstrap completes.
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "http.get('http://localhost:8787/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── agencyhq-postgres ────────────────────────────────────────────────────────
  # AgencyHQ domain ledger database. Separate from the Trigger postgres:14
  # instance to preserve independent schema evolution and data lifecycle.
  # Uses postgres:17.6 matching the test database (infra/db/compose.yaml).
  # Not attached to the `agencyhq` network — only `agencyhq-internal` so
  # runner task containers cannot reach the ledger directly.
  agencyhq-postgres:
    image: postgres:17.6
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    networks:
      - agencyhq-internal  # app ↔ agencyhq-postgres only; NOT on agencyhq network
    volumes:
      - agencyhq-postgres:/var/lib/postgresql/data
      - secrets:/run/agencyhq/secrets:ro
    ports:
      - ${AGENCYHQ_POSTGRES_PUBLISH_IP:-127.0.0.1}:${AGENCYHQ_POSTGRES_PORT:-5435}:5432
    environment:
      POSTGRES_USER: agencyhq
      POSTGRES_DB: agencyhq
      # Password is read from the secrets volume; never passed as a literal value.
      POSTGRES_PASSWORD_FILE: /run/agencyhq/secrets/agencyhq-db-password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agencyhq"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── opencode ────────────────────────────────────────────────────────────────
  # OpenCode AI provider login service. Persists provider credentials across
  # stack restarts in the opencode-data volume.
  #
  # Usage: docker compose exec opencode opencode auth login
  #
  # The container sleeps indefinitely and is restarted if it exits unexpectedly.
  # Task runner containers receive provider credentials via the coordinator's
  # lease broker (ADR-0008 §"Credential delivery").
  opencode:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile
      target: opencode
      platforms:
        - ${AGENCYHQ_PLATFORM:-linux/arm64}
    image: agencyhq/app:opencode
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    networks:
      - agencyhq
    volumes:
      # Provider credentials persist at $HOME/.local/share/opencode
      - opencode-data:/home/opencode/.local/share/opencode
      - opencode-config:/home/opencode/.config/opencode

  # ── bootstrap ───────────────────────────────────────────────────────────────
  # One-shot service (with restart: on-failure for resumability) that:
  #   1. Waits for the Trigger webapp to be healthy
  #   2. Starts a minimal SMTP sink on port 2525 to capture the magic link
  #   3. Creates or finds the AgencyHQ org and project in the Trigger webapp
  #   4. Mints a production environment secret key (trigger-prod.key) and PAT
  #      (trigger-pat.key); persists them in the agencyhq-state volume
  #   5. Runs `trigger deploy --env prod --local-build` via docker-proxy-build
  #   6. Verifies the deployment via GET /api/v1/deployments/current
  #   7. Writes bootstrap.json and enriches deployment.json
  #
  # The bootstrap container uses the `tools` image target which includes the
  # Docker CLI and buildx plugin for the deployer phase.
  #
  # Implementation: apps/bootstrap (P15.2 packet; TypeScript, runs in Node 24).
  bootstrap:
    # The tools image is built once by secrets-init; two services building the
    # same tag makes buildx bake fail with "image already exists".
    image: agencyhq/app:tools
    pull_policy: never
    restart: on-failure
    logging: *logging-config
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      webapp:
        condition: service_healthy
    networks:
      - agencyhq   # bootstrap → app (coordinator)
      - webapp      # bootstrap → Trigger webapp (form submission, API calls)
      - supervisor  # the webapp may advertise an address on any of its networks
      - docker-proxy-build  # bootstrap → docker-proxy-build (deployer phase only)
    volumes:
      - secrets:/run/agencyhq/secrets:ro
      - agencyhq-state:/var/agencyhq/state
    environment:
      # Environment variable names must match what apps/bootstrap/src/cli.ts reads.
      TRIGGER_WEBAPP_URL: http://webapp:3000
      BOOTSTRAP_EMAIL: ${AGENCYHQ_BOOTSTRAP_EMAIL:-bootstrap@agencyhq.local}
      AGENCYHQ_STATE_DIR: /var/agencyhq/state
      AGENCYHQ_WORKSPACE_ROOT: /app
      AGENCYHQ_PLATFORM: ${AGENCYHQ_PLATFORM:-linux/arm64}
      DOCKER_HOST: tcp://docker-proxy-build:2375
      # Docker CLI state (buildx builders) must not land in the read-only /app home.
      DOCKER_CONFIG: /var/agencyhq/state/docker
      # Docker network the buildx builder joins so the Containerfile's indexer RUN
      # step resolves the webapp service name (the advertised API origin).
      AGENCYHQ_BUILD_NETWORK: webapp
      BOOTSTRAP_SMTP_PORT: "2525"
    command:
      - "node"
      - "--experimental-strip-types"
      - "apps/bootstrap/src/cli.ts"
      - "run"

  # ── docker-proxy-build ──────────────────────────────────────────────────────
  # Restricted Docker socket proxy for the bootstrap (deployer) phase.
  # Grants only the operations needed to build and push images:
  #   BUILD=1  SESSION=1  GRPC=1  IMAGES=1  POST=1  INFO=1  VERSION=1
  # Only the bootstrap container is on the docker-proxy-build network.
  docker-proxy-build:
    image: tecnativa/docker-socket-proxy:${DOCKER_PROXY_BUILD_IMAGE_TAG:-v0.5.0}
    restart: ${RESTART_POLICY:-unless-stopped}
    logging: *logging-config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-build
    environment:
      LOG_LEVEL: info
      # The Trigger CLI builds with a buildx docker-container builder: it pulls the
      # buildkit image, creates and starts a (privileged) buildkit container plus
      # its state volume, and drives it over exec. The daemon-side docker driver
      # is not usable through the proxy (the daemon answers 500 to buildx's
      # /grpc h2c upgrade behind haproxy; observed in L1, 2026-09-09), so the
      # proxy allows the container/exec/volume endpoints the builder needs.
      # Only the one-shot bootstrap container can reach this proxy.
      BUILD: 1
      SESSION: 1
      GRPC: 1
      IMAGES: 1
      CONTAINERS: 1
      EXEC: 1
      VOLUMES: 1
      NETWORKS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      POST: 1
      INFO: 1
      VERSION: 1
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "2375"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  agencyhq:
    # app ↔ opencode ↔ bootstrap ↔ runner task containers
    # Runner task containers are attached to this network by the Trigger
    # worker stack (DOCKER_RUNNER_NETWORKS includes agencyhq) so they can
    # reach the coordinator at http://app:8787/internal/*.
    name: agencyhq

  agencyhq-internal:
    # app ↔ agencyhq-postgres only.
    # Not included in DOCKER_RUNNER_NETWORKS: runner task containers
    # cannot reach the domain ledger directly.
    name: agencyhq-internal

  docker-proxy-build:
    # bootstrap ↔ docker-proxy-build only.
    # Isolated from all other services.
    name: docker-proxy-build

  # webapp is declared by infra/trigger/docker-compose.yml (name: webapp).
  # Both files use name: webapp so Docker Compose merges them into one network.
  webapp:
    name: webapp

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  secrets:
    # Internal secrets generated by secrets-init; 0600 files, never committed.

  agencyhq-state:
    # Bootstrap state: bootstrap.json, deployment.json, trigger-prod.key, trigger-pat.key.
    # Survives restart; reset with `docker compose down -v`.

  agencyhq-git:
    # Coordinator-managed bare git mirrors and bundle staging.

  agencyhq-postgres:
    # AgencyHQ domain database data (separate from Trigger's postgres volume).

  opencode-data:
    # OpenCode provider credentials ($HOME/.local/share/opencode).
    # Survives recreating the opencode container.

  opencode-config:
    # OpenCode additional configuration ($HOME/.config/opencode).
